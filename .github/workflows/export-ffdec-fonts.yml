name: Export FFDec fonts

on:
  workflow_call:

permissions:
  contents: read

env:
  JPEXS_REPOSITORY: Tutez64/jpexs-decompiler
  JPEXS_REF: dev

jobs:
  export:
    name: Export SWF fonts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ env.JPEXS_REPOSITORY }}
          ref: ${{ env.JPEXS_REF }}
          path: .ci-temp/jpexs-decompiler

      - name: Resolve FFDec revision
        id: jpexs
        shell: bash
        run: echo "sha=$(git -C .ci-temp/jpexs-decompiler rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "8"

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: ffdec-dist
        with:
          path: .ci-temp/jpexs-decompiler/dist
          key: ffdec-dist-${{ steps.jpexs.outputs.sha }}

      - name: Build FFDec
        if: steps.ffdec-dist.outputs.cache-hit != 'true'
        shell: bash
        working-directory: .ci-temp/jpexs-decompiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ant
          ant build
          test -f dist/ffdec.jar

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.3.7

      # hashFiles is in the exact key so a SWF change stores a new entry.
      # restore-keys reuses the previous tree; ExportSwfFonts then re-exports only stale libraries.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: bin/obj/ffdec_fonts
          key: ffdec-fonts-${{ steps.jpexs.outputs.sha }}-${{ hashFiles('edits/ffdec_fonts/**', 'generated_swf_libraries.xml', 'src/_assets/assets.swf', 'Resources/**/*.swf') }}
          restore-keys: |
            ffdec-fonts-${{ steps.jpexs.outputs.sha }}-

      - name: Export SWF fonts
        shell: bash
        env:
          FFDEC_HOME: ${{ github.workspace }}/.ci-temp/jpexs-decompiler
        run: haxe edits/ffdec_fonts/export_swf_fonts.hxml

      - name: Verify exported fonts
        shell: bash
        run: |
          set -euo pipefail
          count="$(find bin/obj/ffdec_fonts -name '*.ttf' | wc -l)"
          echo "Exported $count TTF file(s) with FFDec ${{ steps.jpexs.outputs.sha }}"
          test "$count" -ge 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffdec-fonts
          path: bin/obj/ffdec_fonts
          if-no-files-found: error
          include-hidden-files: true
