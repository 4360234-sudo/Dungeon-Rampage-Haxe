name: Package DRH

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  package:
    name: ${{ inputs.package_name }}
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libasound2-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libpulse-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Install haxelib dependencies
        shell: bash
        run: |
          haxelib --quiet --always install format 3.8.0
          haxelib --quiet --always install hxp 1.3.1
          haxelib dev hxcpp "$PWD/submodules/hxcpp"
          haxelib dev lime "$PWD/submodules/lime"
          haxelib dev openfl "$PWD/submodules/openfl"
          haxelib dev swf "$PWD/submodules/swf"
          haxelib dev steamwrap "$PWD/submodules/SteamWrap"

      - name: Bootstrap hxcpp
        shell: bash
        run: |
          cd submodules/hxcpp/tools/hxcpp
          haxe compile.hxml

      - name: Clone Steamworks SDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_dir="$PWD/.ci-temp/SteamworksSDK"
          sdk_ref="be6107f4b75bf996531415c53a6488a33a2a1be3"

          rm -rf "$sdk_dir"
          mkdir -p "$sdk_dir"
          git -C "$sdk_dir" init
          git -C "$sdk_dir" remote add origin https://github.com/rlabrecque/SteamworksSDK.git
          git -C "$sdk_dir" fetch --depth 1 origin "$sdk_ref"
          git -C "$sdk_dir" checkout --detach FETCH_HEAD

          if [[ ! -d "$sdk_dir/redistributable_bin" || ! -d "$sdk_dir/public/steam" ]]; then
            echo "Steamworks SDK mirror has an unexpected layout." >&2
            echo "Expected redistributable_bin and public/steam in $sdk_dir." >&2
            exit 1
          fi

          echo "STEAMWORKS_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"

      - name: Configure SteamWrap
        shell: bash
        run: |
          set -euo pipefail

          steamwrap="submodules/SteamWrap"
          sdk="$STEAMWORKS_SDK_DIR"

          mkdir -p \
            "$steamwrap/native/include/steam" \
            "$steamwrap/native/include/hx" \
            "$steamwrap/native/lib/linux64" \
            "$steamwrap/native/lib/osx64" \
            "$steamwrap/native/lib/win32" \
            "$steamwrap/native/lib/win64"

          cp "$sdk"/public/steam/*.h "$steamwrap/native/include/steam/"
          cp submodules/hxcpp/include/hx/*.h "$steamwrap/native/include/hx/"

          case "${{ inputs.platform }}" in
            linux)
              cp "$sdk/redistributable_bin/linux64/libsteam_api.so" "$steamwrap/native/lib/linux64/"
              ;;
            macos)
              if [[ -f "$sdk/redistributable_bin/osx/libsteam_api.dylib" ]]; then
                cp "$sdk/redistributable_bin/osx/libsteam_api.dylib" "$steamwrap/native/lib/osx64/"
              else
                cp "$sdk/redistributable_bin/osx32/libsteam_api.dylib" "$steamwrap/native/lib/osx64/"
              fi
              ;;
            windows)
              cp "$sdk/redistributable_bin/steam_api.dll" "$steamwrap/native/lib/win32/"
              cp "$sdk/redistributable_bin/steam_api.lib" "$steamwrap/native/lib/win32/"
              cp "$sdk/redistributable_bin/win64/steam_api64.dll" "$steamwrap/native/lib/win64/"
              cp "$sdk/redistributable_bin/win64/steam_api64.lib" "$steamwrap/native/lib/win64/"
              ;;
            *)
              echo "Unsupported platform: ${{ inputs.platform }}" >&2
              exit 1
              ;;
          esac

      - name: Rebuild Lime helper tools
        shell: bash
        run: |
          haxelib run lime rebuild cpp -debug
          haxelib run lime rebuild tools
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild swf

      - name: Rebuild Lime native libraries
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.platform }}" in
            linux)
              haxelib run lime rebuild linux -64
              ;;
            windows)
              haxelib run lime rebuild windows -64
              ;;
            macos)
              haxelib run lime rebuild mac -64
              haxelib run lime rebuild mac -arm64
              ;;
          esac

      - name: Build SteamWrap
        shell: bash
        run: |
          set -euo pipefail

          cd submodules/SteamWrap/native
          rm -rf ../obj

          case "${{ inputs.platform }}" in
            linux|windows)
              haxelib run hxcpp Build.xml -DHXCPP_M64
              ;;
            macos)
              haxelib run hxcpp Build.xml -DHXCPP_M64
              rm -rf ../obj
              haxelib run hxcpp Build.xml -DHXCPP_ARM64
              ;;
          esac

      - name: Build Linux
        if: inputs.platform == 'linux'
        shell: bash
        run: haxelib run openfl build project.xml cpp -Dfinal

      - name: Package Linux
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          staging_parent="$RUNNER_TEMP/drh-package"
          staging="$staging_parent/Dungeon Rampage Haxe"
          archive="dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.Linux.tar.gz"

          rm -rf "$staging_parent"
          mkdir -p "$staging_parent" dist
          cp -a "bin/linux/bin" "$staging"
          rm -f "$staging/steam_appid.txt"

          test -x "$staging/Dungeon Rampage Haxe"
          test -f "$staging/steamwrap.ndll"
          test -f "$staging/libsteam_api.so"

          tar -C "$staging_parent" -czf "$archive" "Dungeon Rampage Haxe"

      - name: Build Windows
        if: inputs.platform == 'windows'
        shell: pwsh
        run: haxelib run openfl build project.xml cpp -Dfinal

      - name: Package Windows
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stagingParent = Join-Path $env:RUNNER_TEMP "drh-package"
          $staging = Join-Path $stagingParent "Dungeon Rampage Haxe"
          $archive = "dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.Windows.zip"

          Remove-Item -Recurse -Force $stagingParent -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stagingParent, "dist" | Out-Null
          Copy-Item -Recurse "bin/windows/bin" $staging
          Remove-Item (Join-Path $staging "steam_appid.txt") -ErrorAction SilentlyContinue

          if (!(Test-Path (Join-Path $staging "Dungeon Rampage Haxe.exe"))) { throw "Missing Windows executable" }
          if (!(Test-Path (Join-Path $staging "steamwrap.ndll"))) { throw "Missing steamwrap.ndll" }
          if (!(Test-Path (Join-Path $staging "steam_api64.dll"))) { throw "Missing steam_api64.dll" }

          Compress-Archive -Path $staging -DestinationPath $archive -Force

      - name: Build and package macOS
        if: inputs.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          tools/macos/release_macos_all.sh \
            --output-zip "dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.macOS.zip" \
            -- -Dfinal

          macos_app="bin/macos/bin/Dungeon Rampage Haxe.app"
          test -d "$macos_app"
          test -f "$macos_app/Contents/MacOS/steamwrap.ndll"
          test -f "$macos_app/Contents/MacOS/libsteam_api.dylib"
          test ! -f "$macos_app/Contents/MacOS/steam_appid.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          archive: false
