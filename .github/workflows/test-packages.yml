name: Test Packages

on:
  workflow_dispatch:
    inputs:
      fps:
        description: Target frame rate
        required: true
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: test-packages-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  export-fonts:
    name: Export SWF fonts
    uses: ./.github/workflows/export-ffdec-fonts.yml

  package:
    name: Package ${{ matrix.name }}
    needs: export-fonts
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
          - name: Windows x64
            runner: windows-2022
            platform: windows
          - name: macOS universal
            runner: macos-26
            platform: macos
    uses: ./.github/workflows/package-drh.yml
    with:
      artifact_name: drh-test-${{ matrix.platform }}
      fps: ${{ inputs.fps }}
      package_name: ${{ matrix.name }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: test-${{ github.run_number }}
